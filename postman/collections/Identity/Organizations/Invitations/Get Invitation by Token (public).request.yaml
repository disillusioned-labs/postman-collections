$kind: http-request
url: "{{base_url}}{{identity_port}}/api/v1/invitations/token/{{invitation_token}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Public invitation preview succeeded", () => pm.response.code < 300);
    language: text/javascript
order: 4500
