$kind: http-request
url: "{{base_url}}{{identity_port}}/api/v1/auth/logout"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "refresh_token": "{{refresh_token}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Logout succeeded", () => pm.response.code < 300);
    language: text/javascript
order: 3500
