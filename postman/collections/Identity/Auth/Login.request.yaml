$kind: http-request
url: "{{base_url}}{{identity_port}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "imannuel@example.com",
        "password": "secretpassword"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login succeeded", () => pm.response.code < 300);
      const body = pm.response.json();
      if (body.data && body.data.access_token) {
          pm.collectionVariables.set('access_token', body.data.access_token);
          pm.collectionVariables.set('refresh_token', body.data.refresh_token);
      }
    language: text/javascript
order: 2000
