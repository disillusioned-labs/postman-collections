$kind: http-request
url: "{{base_url}}{{expense_port}}/api/v1/projects/{{project_id}}/documents"
method: POST
description: |-
  Standalone upload: multipart/form-data with a `file` field (max 25MB) - attach it in the Body tab (Postman CLI yaml cannot embed binary content).
  project_id is REQUIRED in the path; archived project answers 409 PROJECT_ARCHIVED.
  The transaction does NOT exist yet - the OCR consumer creates the draft (status `draft`) from the
  `document.processed` event once OCR succeeds. Answers 202: OCR runs asynchronously; poll
  List Project Documents / Get Document for `ocr_status`.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Accepted", () => pm.response.code < 300);
      const body = pm.response.json();
      if (body.data && body.data.id) {
          pm.collectionVariables.set('document_id', body.data.id);
      }
    language: text/javascript
order: 500
