$kind: http-request
url: "{{base_url}}{{expense_port}}/api/v1/approvals/assigned"
method: GET
description: |-
  Active approvals waiting on the caller - a later-step approver appears only after the earlier step completes.
scripts:
  - type: afterResponse
    code: |-
      pm.test("OK", () => pm.response.code < 300);
      const body = pm.response.json();
      if (body.data && body.data.length && body.data[0].approval_id) {
          pm.collectionVariables.set('approval_id', body.data[0].approval_id);
      }
    language: text/javascript
order: 3000
