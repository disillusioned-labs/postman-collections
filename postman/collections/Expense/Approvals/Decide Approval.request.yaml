$kind: http-request
url: "{{base_url}}{{expense_port}}/api/v1/approvals/{{approval_id}}/decide"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "decision": "approved",
        "notes": ""
    }
description: |-
  decision: approved | rejected. `notes` is REQUIRED when rejecting (422 otherwise).
  Decisions are append-only - they can never be edited or deleted.
order: 4000
